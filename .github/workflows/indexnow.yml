name: Signaler les mises a jour a Bing

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Recuperer le site
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Attendre le deploiement Pages du commit
        uses: actions/github-script@v7
        with:
          script: |
            const targetSha = context.sha;
            const maxAttempts = 24;
            const pauseMs = 15_000;

            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              try {
                const { data: build } = await github.rest.repos.getLatestPagesBuild({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                });

                core.info(`Pages: commit=${build.commit}, status=${build.status} (tentative ${attempt}/${maxAttempts})`);
                if (build.commit === targetSha && build.status === "built") return;
                if (build.commit === targetSha && build.status === "errored") {
                  core.setFailed(`Le deploiement GitHub Pages du commit ${targetSha} a echoue.`);
                  return;
                }
              } catch (error) {
                core.info(`Le build GitHub Pages n'est pas encore disponible: ${error.message}`);
              }

              if (attempt < maxAttempts) {
                await new Promise((resolve) => setTimeout(resolve, pauseMs));
              }
            }

            core.setFailed(`GitHub Pages n'a pas publie le commit ${targetSha} avant le delai imparti.`);

      - name: Prevenir IndexNow
        run: node scripts/submit-indexnow.mjs "${{ github.event.before }}" "${{ github.sha }}"
